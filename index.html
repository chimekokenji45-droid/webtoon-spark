<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Arcade Hub</title>

  <!-- Telegram Mini App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Ads Galaxy SDK -->
  <script src="https://adsgalaxy.net/sdk.js" async></script>

  <style>
    :root {
      --bg-color: #0b0c10;
      --card-bg: #1f2833;
      --accent-color: #66fcf1;
      --accent-gold: #ffb703;
      --text-color: #ffffff;
      --text-muted: #c5c6c7;
      --danger: #ff4d4d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding-bottom: 30px;
    }

    header {
      position: sticky;
      top: 0;
      width: 100%;
      background: rgba(11, 12, 16, 0.95);
      backdrop-filter: blur(8px);
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      border-bottom: 1px solid rgba(102, 252, 241, 0.2);
    }

    .app-title {
      font-weight: 800;
      font-size: 1.2rem;
      color: var(--accent-color);
      letter-spacing: 1px;
    }

    .game-nav {
      display: flex;
      gap: 8px;
    }

    .nav-btn {
      background: var(--card-bg);
      color: var(--text-color);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }

    .nav-btn.active {
      background: var(--accent-color);
      color: #000;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .game-card {
      width: 100%;
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      display: none;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.05);
    }

    .game-card.active {
      display: flex;
    }

    /* Tic-Tac-Toe Styling */
    .ttt-board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
      max-width: 280px;
      margin: 20px 0;
    }

    .ttt-cell {
      aspect-ratio: 1;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: bold;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Snake Canvas */
    canvas {
      background: #000;
      border-radius: 12px;
      border: 2px solid var(--accent-color);
      margin: 15px 0;
    }

    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 50px);
      grid-template-rows: repeat(3, 50px);
      gap: 5px;
      margin-top: 10px;
    }

    .dbtn {
      background: rgba(255,255,255,0.1);
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .dbtn:active {
      background: var(--accent-color);
      color: #000;
    }

    /* Locked Card */
    .ad-btn {
      background: linear-gradient(135deg, #ffb703, #fb8500);
      color: #000;
      font-weight: 700;
      border: none;
      padding: 14px 20px;
      border-radius: 25px;
      font-size: 0.95rem;
      cursor: pointer;
      width: 100%;
      margin-top: 15px;
      box-shadow: 0 4px 15px rgba(255, 183, 3, 0.25);
    }

    .action-btn {
      background: var(--accent-color);
      color: #000;
      font-weight: 700;
      border: none;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 0.9rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <div class="app-title">🎮 ARCADE</div>
    <div class="game-nav">
      <button class="nav-btn active" onclick="switchTab('ttt')">Tic-Tac-Toe</button>
      <button class="nav-btn" onclick="switchTab('snake')">Snake</button>
      <button class="nav-btn" onclick="switchTab('bonus')">Bonus 🔒</button>
    </div>
  </header>

  <div class="container">

    <!-- TIC TAC TOE -->
    <div id="game-ttt" class="game-card active">
      <h3>Tic-Tac-Toe vs AI</h3>
      <p id="ttt-status" style="margin-top:8px; color:var(--text-muted);">Your turn (X)</p>
      <div class="ttt-board" id="ttt-board"></div>
      <button class="action-btn" onclick="resetTTT()">Restart Game</button>
    </div>

    <!-- SNAKE GAME -->
    <div id="game-snake" class="game-card">
      <h3>Snake Arcade</h3>
      <p style="margin-top:4px; color:var(--text-muted);">Score: <span id="snake-score">0</span></p>
      <canvas id="snakeCanvas" width="280" height="280"></canvas>
      <div class="dpad">
        <div></div>
        <button class="dbtn" onclick="setDir('UP')">▲</button>
        <div></div>
        <button class="dbtn" onclick="setDir('LEFT')">◀</button>
        <div></div>
        <button class="dbtn" onclick="setDir('RIGHT')">▶</button>
        <div></div>
        <button class="dbtn" onclick="setDir('DOWN')">▼</button>
        <div></div>
      </div>
    </div>

    <!-- BONUS LOCKED GAME -->
    <div id="game-bonus" class="game-card">
      <div id="bonus-locked-view" style="text-align:center;">
        <h3>🔒 Unlocks VIP Speed Tap</h3>
        <p style="color:var(--text-muted); margin: 12px 0;">Watch a fast sponsored video ad to unlock the bonus mini-game!</p>
        <button class="ad-btn" onclick="unlockBonusGame()">🎬 Watch Ad to Unlock</button>
      </div>
      <div id="bonus-unlocked-view" style="display:none; text-align:center;">
        <h3>⚡ Speed Tap Challenge</h3>
        <p style="margin: 10px 0; color:var(--text-muted);">Tap as fast as you can in 10 seconds!</p>
        <h1 id="tap-count" style="font-size: 3rem; color:var(--accent-color); margin: 15px 0;">0</h1>
        <button class="action-btn" onclick="countTap()">TAP ME!</button>
      </div>
    </div>

  </div>

  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    function switchTab(tab) {
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.game-card').forEach(c => c.classList.remove('active'));

      if (tab === 'ttt') {
        document.querySelectorAll('.nav-btn')[0].classList.add('active');
        document.getElementById('game-ttt').classList.add('active');
      } else if (tab === 'snake') {
        document.querySelectorAll('.nav-btn')[1].classList.add('active');
        document.getElementById('game-snake').classList.add('active');
        initSnake();
      } else if (tab === 'bonus') {
        document.querySelectorAll('.nav-btn')[2].classList.add('active');
        document.getElementById('game-bonus').classList.add('active');
      }
    }

    /* TIC TAC TOE LOGIC */
    let tttState = ["", "", "", "", "", "", "", "", ""];
    let tttActive = true;

    function renderTTT() {
      const board = document.getElementById('ttt-board');
      board.innerHTML = '';
      tttState.forEach((val, idx) => {
        const cell = document.createElement('div');
        cell.className = 'ttt-cell';
        cell.innerText = val;
        cell.onclick = () => handleTTTClick(idx);
        board.appendChild(cell);
      });
    }

    function handleTTTClick(idx) {
      if (tttState[idx] !== "" || !tttActive) return;
      tttState[idx] = "X";
      renderTTT();
      if (checkWin("X")) {
        document.getElementById('ttt-status').innerText = "You Won! 🎉";
        tttActive = false;
        return;
      }
      if (!tttState.includes("")) {
        document.getElementById('ttt-status').innerText = "Draw Game!";
        return;
      }
      
      // AI Move
      tttActive = false;
      document.getElementById('ttt-status').innerText = "AI is thinking...";
      setTimeout(() => {
        let empty = tttState.map((v, i) => v === "" ? i : null).filter(v => v !== null);
        let move = empty[Math.floor(Math.random() * empty.length)];
        tttState[move] = "O";
        renderTTT();
        if (checkWin("O")) {
          document.getElementById('ttt-status').innerText = "AI Won! 🤖";
        } else {
          document.getElementById('ttt-status').innerText = "Your turn (X)";
          tttActive = true;
        }
      }, 400);
    }

    function checkWin(p) {
      const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
      return wins.some(w => w.every(i => tttState[i] === p));
    }

    function resetTTT() {
      tttState = ["", "", "", "", "", "", "", "", ""];
      tttActive = true;
      document.getElementById('ttt-status').innerText = "Your turn (X)";
      renderTTT();
    }
    renderTTT();

    /* SNAKE LOGIC */
    const canvas = document.getElementById("snakeCanvas");
    const ctx = canvas.getContext("2d");
    let snake, food, dir, gameLoop, score;

    function initSnake() {
      clearInterval(gameLoop);
      snake = [{x: 140, y: 140}];
      food = spawnFood();
      dir = "RIGHT";
      score = 0;
      document.getElementById('snake-score').innerText = score;
      gameLoop = setInterval(updateSnake, 150);
    }

    function setDir(newDir) {
      if (newDir === 'UP' && dir !== 'DOWN') dir = 'UP';
      if (newDir === 'DOWN' && dir !== 'UP') dir = 'DOWN';
      if (newDir === 'LEFT' && dir !== 'RIGHT') dir = 'LEFT';
      if (newDir === 'RIGHT' && dir !== 'LEFT') dir = 'RIGHT';
    }

    function spawnFood() {
      return {
        x: Math.floor(Math.random() * 14) * 20,
        y: Math.floor(Math.random() * 14) * 20
      };
    }

    function updateSnake() {
      let head = {...snake[0]};
      if (dir === 'UP') head.y -= 20;
      if (dir === 'DOWN') head.y += 20;
      if (dir === 'LEFT') head.x -= 20;
      if (dir === 'RIGHT') head.x += 20;

      if (head.x < 0 || head.x >= 280 || head.y < 0 || head.y >= 280 || snake.some(s => s.x === head.x && s.y === head.y)) {
        clearInterval(gameLoop);
        alert("Game Over! Score: " + score);
        return;
      }

      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        document.getElementById('snake-score').innerText = score;
        food = spawnFood();
      } else {
        snake.pop();
      }

      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, 280, 280);
      ctx.fillStyle = "#ff4d4d";
      ctx.fillRect(food.x, food.y, 18, 18);
      ctx.fillStyle = "#66fcf1";
      snake.forEach(s => ctx.fillRect(s.x, s.y, 18, 18));
    }

    /* BONUS UNLOCK LOGIC */
    let taps = 0;
    function unlockBonusGame() {
      if (window.Telegram?.WebApp?.HapticFeedback) {
        window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
      }
      alert("Ad complete!");
      document.getElementById('bonus-locked-view').style.display = 'none';
      document.getElementById('bonus-unlocked-view').style.display = 'block';
    }

    function countTap() {
      taps++;
      document.getElementById('tap-count').innerText = taps;
    }
  </script>
</body>
  </html>
