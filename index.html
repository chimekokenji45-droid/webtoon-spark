<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Webtoon Spark</title>

  <!-- Telegram Mini App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Ads Galaxy SDK Script -->
  <script src="https://adsgalaxy.net/sdk.js" async></script>

  <style>
    :root {
      --bg-color: #0d0e12;
      --card-bg: #1a1b23;
      --accent-color: #0088cc;
      --accent-gold: #ffb703;
      --text-color: #ffffff;
      --text-muted: #9e9e9e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding-bottom: 40px;
    }

    header {
      position: sticky;
      top: 0;
      width: 100%;
      background: rgba(13, 14, 18, 0.95);
      backdrop-filter: blur(8px);
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .comic-title {
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--accent-color);
    }

    select {
      background: var(--card-bg);
      color: var(--text-color);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      outline: none;
    }

    .reader-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
    }

    .comic-panel {
      width: 100%;
      display: block;
      margin-bottom: -1px;
      object-fit: cover;
    }

    .locked-card {
      margin: 60px 20px;
      padding: 30px 20px;
      background: var(--card-bg);
      border-radius: 16px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    
    <header>
  <div class="comic-title">The Forgotten Gods</div>
  <select id="chapterSelect" onchange="changeChapter()">
    <option value="1">Chapter 1</option>
    <option value="2">Chapter 2</option>
    <option value="3" id="opt-ch3">Chapter 3 🔒</option>
  </select>
</header>

    .locked-card h3 {
      font-size: 1.25rem;
      margin-bottom: 10px;
    }

    .locked-card p {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 24px;
      line-height: 1.4;
    }

    .ad-btn {
      background: linear-gradient(135deg, #ffb703, #fb8500);
      color: #000;
      font-weight: 700;
      border: none;
      padding: 14px 20px;
      border-radius: 25px;
      font-size: 0.95rem;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 4px 15px rgba(255, 183, 3, 0.25);
    }

    .ad-btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  

  <div class="reader-container" id="reader"></div>

  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    const comicData = {
      1: {
        locked: false,
        panels: [
          "https://dummyimage.com/600x900/1a1b23/ffffff&text=Chapter+1+-+Panel+1",
          "https://dummyimage.com/600x900/12131c/ffffff&text=Chapter+1+-+Panel+2"
        ]
      },
      2: {
        locked: false,
        panels: [
          "https://dummyimage.com/600x900/1a1b23/ffffff&text=Chapter+2+-+Panel+1",
          "https://dummyimage.com/600x900/12131c/ffffff&text=Chapter+2+-+Panel+2"
        ]
      },
      3: {
        locked: true,
        panels: [
          "https://dummyimage.com/600x900/1a1b23/ffffff&text=Chapter+3+-+Unlocked+Panel+1",
          "https://dummyimage.com/600x900/12131c/ffffff&text=Chapter+3+-+Unlocked+Panel+2"
        ]
      }
    };

    function renderChapter(ch) {
      const container = document.getElementById('reader');
      container.innerHTML = '';
      const chapter = comicData[ch];

      if (chapter.locked) {
        container.innerHTML = `
          <div class="locked-card">
            <h3>Chapter ${ch} is Locked</h3>
            <p>Watch a short video ad to instantly unlock Chapter ${ch}!</p>
            <button class="ad-btn" onclick="triggerRewardedAd(${ch})">🎬 Watch Ad to Unlock</button>
          </div>
        `;
      } else {
        chapter.panels.forEach(src => {
          const img = document.createElement('img');
          img.src = src;
          img.className = 'comic-panel';
          img.alt = `Comic Panel`;
          container.appendChild(img);
        });
      }
    }

    function changeChapter() {
      const selected = parseInt(document.getElementById('chapterSelect').value);
      renderChapter(selected);
      window.scrollTo(0, 0);
    }

    function triggerRewardedAd(chapterNum) {
      if (window.Telegram?.WebApp?.HapticFeedback) {
        window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
      }

      alert("Ad completed!");

      comicData[chapterNum].locked = false;
      const option = document.getElementById(`opt-ch${chapterNum}`);
      if (option) option.innerText = `Chapter ${chapterNum}`;
      renderChapter(chapterNum);
    }

    renderChapter(1);
  </script>
</body>
  </html>
